<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; touch-action: none; color: #fff; }
        canvas { display: block; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 100; }
        .auth-box { display: flex; flex-direction: column; gap: 10px; width: 260px; }
        input { padding: 14px; border-radius: 10px; border: 1px solid #0ff; background: #111; color: #fff; outline: none; font-size: 16px; }
        button { padding: 14px; font-weight: bold; background: transparent; border: 2px solid #0ff; color: #0ff; border-radius: 12px; cursor: pointer; font-size: 16px; }
        button:active { background: #0ff; color: #000; }
        #topBtn { position: absolute; top: 15px; right: 15px; width: 55px; height: 55px; z-index: 150; border: 2px solid #f0f; border-radius: 50%; background: rgba(0,0,0,0.6); font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #f0f; cursor: pointer; }
        #leaderboard { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: #0a0a0a; border: 2px solid #f0f; border-radius: 20px; z-index: 200; padding: 20px; box-sizing: border-box; flex-direction: column; }
        #scoresList { flex-grow: 1; overflow-y: auto; margin-top: 15px; border-top: 1px solid #333; }
        .score-item { display: flex; justify-content: space-between; padding: 14px; border-bottom: 1px solid #222; font-size: 18px; }
        #hud { position: absolute; top: 20px; left: 20px; font-size: 35px; font-weight: bold; z-index: 50; text-shadow: 0 0 10px #0ff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">0</div>
    <div id="topBtn">🏆</div>

    <div id="authScreen" class="overlay">
        <h1 style="color:#0ff">NEON AUTH</h1>
        <div class="auth-box">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button id="authBtn">ИГРАТЬ</button>
        </div>
    </div>

    <div id="menuScreen" class="overlay hidden">
        <h1 style="color:#0ff">READY?</h1>
        <button id="startBtn" style="font-size: 28px; padding: 20px 60px;">PLAY</button>
    </div>

    <div id="deathScreen" class="overlay hidden">
        <h1 style="color:#f44">BOOM!</h1>
        <h2 id="finalScore" style="font-size: 40px;">0</h2>
        <button id="retryBtn">RETRY</button>
    </div>

    <div id="leaderboard">
        <h2 style="color:#f0f; text-align:center; margin:0;">GLOBAL BOARD</h2>
        <div id="scoresList"></div>
        <button style="margin-top:15px; border-color:#f0f; color:#f0f;" onclick="closeTop()">BACK</button>
    </div>

    <canvas id="game"></canvas>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAvTS4C72LaYyCwWd4o6BnSpbm2xsbiHI4",
    authDomain: "sashki-bedcc.firebaseapp.com",
    databaseURL: "https://sashki-bedcc-default-rtdb.firebaseio.com",
    projectId: "sashki-bedcc",
    storageBucket: "sashki-bedcc.firebasestorage.app",
    messagingSenderId: "424272248642",
    appId: "1:424272248642:web:cc9f2e5541a86f7dbb92db"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameState = 'AUTH', prevGameState = '', score = 0, obstacles = [], frame = 0, currentUser = null;

const player = { x: 80, y: canvas.height/2, r: 12, v: 0, g: 0.22, j: -5.5 };

document.getElementById('authBtn').onclick = async () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    try { await auth.signInWithEmailAndPassword(email, pass); } 
    catch (e) {
        if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
            try { await auth.createUserWithEmailAndPassword(email, pass); } 
            catch (err) { alert(err.message); }
        } else { alert(e.message); }
    }
};

auth.onAuthStateChanged(user => { if (user) { currentUser = user; gameState = 'MENU'; document.getElementById('authScreen').classList.add('hidden'); document.getElementById('menuScreen').classList.remove('hidden'); } });

function spawn() {
    const gap = 280 - Math.min(score * 1.5, 60); 
    const h = Math.random() * (canvas.height - gap - 150) + 75;
    obstacles.push({ x: canvas.width, top: h, bottom: h + gap, w: 60, passed: false });
}

function drawCrystal(x, y, w, h, isTop) {
    ctx.fillStyle = '#111'; ctx.strokeStyle = isTop ? '#f0f' : '#0ff'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (isTop) { ctx.moveTo(x,0); ctx.lineTo(x+w,0); ctx.lineTo(x+w/2,h); }
    else { ctx.moveTo(x+w/2,y); ctx.lineTo(x+w,canvas.height); ctx.lineTo(x,canvas.height); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
}

function update() {
    if (gameState !== 'PLAY') return;
    player.v += player.g; player.y += player.v;
    if (player.y > canvas.height || player.y < 0) die();
    if (frame % 100 === 0) spawn();
    obstacles.forEach((o, i) => {
        o.x -= (3.5 + score * 0.05);
        if (player.x + 7 > o.x && player.x - 7 < o.x + o.w) {
            if (player.y - 7 < o.top || player.y + 7 > o.bottom) die();
        }
        if (!o.passed && o.x < player.x) { o.passed=true; score++; document.getElementById('hud').innerText=score; }
        if (o.x + o.w < 0) obstacles.splice(i, 1);
    });
    frame++;
}

function draw() {
    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);
    obstacles.forEach(o => { drawCrystal(o.x, 0, o.w, o.top, true); drawCrystal(o.x, o.bottom, o.w, canvas.height - o.bottom, false); });
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 15; ctx.shadowColor = '#0ff'; ctx.fill(); ctx.shadowBlur = 0;
    
    // Если на паузе — просто рисуем текущий кадр без апдейта
    if (gameState === 'PLAY') {
        update();
        requestAnimationFrame(draw);
    } else if (gameState === 'PAUSE') {
        requestAnimationFrame(draw);
    }
}

async function die() {
    gameState = 'DEAD';
    document.getElementById('deathScreen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score;
    
    if (score > 0 && currentUser) {
        const userRef = db.collection("leaderboard").doc(currentUser.uid);
        try {
            const doc = await userRef.get();
            if (!doc.exists || score > doc.data().score) {
                // Сохраняем/обновляем только если счет больше предыдущего
                await userRef.set({
                    name: currentUser.email.split('@')[0],
                    score: score,
                    ts: Date.now()
                }, { merge: true });
            }
        } catch (e) { console.error("Ошибка сохранения:", e); }
    }
}

function start() {
    player.y = canvas.height/2; player.v = 0; score = 0;
    obstacles = []; frame = 0;
    document.getElementById('hud').innerText = "0";
    gameState = 'PLAY';
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('deathScreen').classList.add('hidden');
    draw();
}

document.getElementById('startBtn').onclick = start;
document.getElementById('retryBtn').onclick = start;

document.getElementById('topBtn').onclick = async () => {
    // Пауза при открытии ТОПа
    if (gameState === 'PLAY') {
        prevGameState = 'PLAY';
        gameState = 'PAUSE';
    } else {
        prevGameState = gameState;
    }

    const lb = document.getElementById('leaderboard');
    lb.style.display = 'flex';
    const list = document.getElementById('scoresList');
    list.innerHTML = "Загрузка...";
    
    const snap = await db.collection("leaderboard").orderBy("score", "desc").get();
    list.innerHTML = "";
    snap.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `<div class="score-item"><span>${d.name}</span><b>${d.score}</b></div>`;
    });
};

function closeTop() {
    document.getElementById('leaderboard').style.display = 'none';
    // Возвращаем из паузы, если играли
    if (prevGameState === 'PLAY') {
        gameState = 'PLAY';
        draw();
    } else {
        gameState = prevGameState;
    }
}

window.ontouchstart = (e) => { 
    if(gameState === 'PLAY') { player.v = player.j; e.preventDefault(); }
    if(gameState === 'DEAD' && e.target.id !== 'retryBtn' && e.target.id !== 'topBtn') start();
};
window.onmousedown = () => { if(gameState === 'PLAY') player.v = player.j; };

draw();
</script>
</body>
</html>
